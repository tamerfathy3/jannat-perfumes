<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANNAT Perfumes — فهرس العطور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0a08; --gold:#c6a15b; --gold-bright:#e8c77e;
    --cream:#f2ead9; --muted:#8f8672;
    --hairline: rgba(198,161,91,0.28); --hairline-soft: rgba(198,161,91,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--black);
    background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(198,161,91,0.08), transparent 60%);
    color:var(--cream); font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 20px 80px; }

  .hero{ text-align:center; padding:0 0 24px; }
  .hero img.cover{ display:block; width:calc(100% + 40px); margin:0 -20px 22px; height:auto; }
  .hero .tagline{ font-weight:300; font-size:14px; color:var(--muted); letter-spacing:0.04em; line-height:2; margin-top:6px; padding:0 8px; }
  .hero .rule{ width:56px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:22px auto 0; }

  .tabs{ display:flex; gap:8px; overflow-x:auto; padding:26px 0 4px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; padding:9px 18px; border:1px solid var(--hairline); border-radius:999px;
    font-size:13.5px; color:var(--muted); background:transparent; white-space:nowrap; }
  .tab.active{ border-color:var(--gold); color:var(--gold-bright); background:rgba(198,161,91,0.08); }
  .tab-icon{ margin-inline-end:5px; font-size:13px; filter:grayscale(0.15) saturate(0.8); opacity:0.9; }
  .tab b{ font-weight:600; margin-inline-start:4px; opacity:0.8; }

  .search-block{ padding:18px 0 6px; }
  .search-field{ position:relative; border-bottom:1px solid var(--hairline); transition:border-color .25s; }
  .search-field:focus-within{ border-color:var(--gold); }
  .search-field input{ width:100%; background:transparent; border:none; outline:none; color:var(--cream);
    font-family:'Cairo',sans-serif; font-size:16px; padding:10px 4px 12px 30px; text-align:right; }
  .search-field input::placeholder{ color:var(--muted); font-weight:300; }
  .search-icon{ position:absolute; left:4px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.55; }
  .search-icon svg{ stroke:var(--gold); }
  .result-count{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:14px; font-weight:300; }
  .result-count b{ color:var(--gold); font-weight:600; }

  .catalogue{ margin-top:8px; }
  .letter-group{ margin-top:30px; }
  .letter-head{ display:flex; align-items:center; gap:14px; margin-bottom:4px; }
  .letter-head .glyph{ font-family:'Aref Ruqaa',serif; font-size:24px; color:var(--gold-bright); min-width:28px; text-align:center; }
  .letter-head .line{ flex:1; height:1px; background:var(--hairline-soft); }

  .entry-list{ list-style:none; margin:6px 0 0; padding:0; }
  .entry{ display:block; text-decoration:none; color:inherit; }
  .entry-row{ display:flex; align-items:center; gap:13px; padding:13px 2px; border-bottom:1px solid var(--hairline-soft); transition:background .18s; }
  .entry:active .entry-row, .entry:hover .entry-row{ background:rgba(198,161,91,0.06); }
  .entry-main{ flex:1; min-width:0; }
  .entry-name{ font-size:16px; font-weight:400; color:var(--cream); letter-spacing:.01em; }
  .entry:hover .entry-name, .entry:active .entry-name{ color:var(--gold-bright); }
  .entry-sub{ font-family:'Cormorant Garamond',serif; font-size:12.5px; color:var(--muted); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.02em; }
  .entry-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .chip{ font-size:10px; padding:3px 8px; border:1px solid var(--hairline); border-radius:999px; color:var(--gold); white-space:nowrap; }
  .order-btn{ flex-shrink:0; width:32px; height:32px; border-radius:50%; border:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:center; transition:border-color .18s, background .18s; }
  .entry:hover .order-btn, .entry:active .order-btn{ border-color:var(--gold); background:rgba(198,161,91,0.1); }
  .order-btn svg{ width:14px; height:14px; fill:var(--gold); }

  .no-results{ text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; display:none; }
  .no-results .glyph{ font-family:'Aref Ruqaa',serif; font-size:30px; color:var(--gold); display:block; margin-bottom:14px; }


  .footer{ margin-top:56px; text-align:center; padding-top:24px; border-top:1px solid var(--hairline-soft); }
  .footer .note{ font-size:11px; color:var(--muted); line-height:1.9; }
</style>
</head>

function normalizeLetter(ch){
  const map = { "أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ة":"ه","ى":"ي" };
  return map[ch] || ch;
}
function firstLetterKey(name){
  const ch = name.trim().charAt(0);
  if (/[A-Za-z0-9]/.test(ch)) return "#";
  return normalizeLetter(ch);
}

function matchesTab(p, key){
  if (key === 'all') return true;
  if (key === 'men' || key === 'women' || key === 'unisex') return p.g === key;
  const def = TAB_DEFS.find(t => t.key === key);
  if (!def) return true;
  const tagOk = def.tag ? p.t.includes(def.tag) : true;
  const genderOk = def.gender ? p.g === def.gender : true;
  return tagOk && genderOk;
}

function counts(){
  const c = {};
  TAB_DEFS.forEach(t => c[t.key] = PERFUMES.filter(p => matchesTab(p, t.key)).length);
  return c;
}

function renderTabs(){
  const c = counts();
  tabsEl.innerHTML = '';
  TAB_DEFS.forEach(({key, label, icon}) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === activeTab ? ' active' : '');
    btn.innerHTML = `<span class="tab-icon">${icon}</span>${label} <b>${c[key]}</b>`;
    btn.addEventListener('click', () => { activeTab = key; renderTabs(); render(searchInput.value); });
    tabsEl.appendChild(btn);
  });
}

}

      listEl.appendChild(li);
    });
    groupEl.appendChild(listEl);
    catalogueEl.appendChild(groupEl);
  });

  noResultsEl.style.display = pool.length === 0 ? 'block' : 'none';
  resultCountEl.innerHTML = q
    ? `<b>${pool.length}</b> نتيجة`
    : `<b>${pool.length}</b> عطر في هذا القسم`;
}

searchInput.addEventListener('input', e => render(e.target.value));
renderTabs();
render('');
</script>

</body>
</html>
